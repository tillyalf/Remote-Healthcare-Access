[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rha"
version = "0.1.0"
description = "Geospatial + ML investigation of barriers to healthcare access across Australian SA2s"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "geopandas>=1.0",
    "pyogrio>=0.9",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
analysis = ["esda>=2.5", "libpysal>=4.10", "scikit-learn>=1.4"]
app = ["fastapi>=0.110", "uvicorn>=0.29", "streamlit>=1.33", "folium>=0.16", "streamlit-folium>=0.18"]
geocode = ["geopy>=2.4"]
dev = ["pytest>=8", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
